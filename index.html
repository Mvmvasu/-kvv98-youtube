<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KVV98 - Official Channel</title>
  <style>
    :root {
      --bg: #0f0f0f;
      --card-bg: #1e1e1e;
      --text: #f1f1f1;
      --subtext: #aaaaaa;
      --accent: #ff0000;
      --btn-hover: #cc0000;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 2rem 1rem;
    }
    .container {
      max-width: 600px;
      width: 100%;
      text-align: center;
    }
    .avatar {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: #2a2a2a;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1rem;
      font-size: 2.5rem;
      font-weight: 700;
      border: 3px solid var(--accent);
    }
    h1 {
      font-size: 1.8rem;
      margin-bottom: 0.25rem;
    }
    p.handle {
      color: var(--subtext);
      font-size: 1rem;
      margin-bottom: 1.5rem;
    }
    .subscribe-btn {
      display: inline-block;
      background-color: var(--accent);
      color: #fff;
      padding: 0.8rem 1.8rem;
      border-radius: 24px;
      text-decoration: none;
      font-weight: 600;
      font-size: 1rem;
      transition: background 0.2s;
      margin-bottom: 1.5rem;
    }
    .video-container {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%;
      height: 0;
      margin-bottom: 1.5rem;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #333;
    }
    .video-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
    .links-section {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .link-card {
      background: var(--card-bg);
      padding: 1rem 1.25rem;
      border-radius: 12px;
      text-decoration: none;
      color: var(--text);
      font-weight: 500;
      border: 1px solid #2f2f2f;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="avatar">K</div>
    <h1>KVV98</h1>
    <p class="handle">@kvv98</p>
    <a href="https://www.youtube.com/@kvv98?sub_confirmation=1" target="_blank" class="subscribe-btn">
      Subscribe on YouTube
    </a>

    <!-- YouTube Video Player -->
    <div class="video-container">
      <iframe 
        src="https://www.youtube.com/embed/YOUR_VIDEO_ID" 
        title="KVV98 Video" 
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
        allowfullscreen>
      </iframe>
    </div>

    <div class="links-section">
      <a href="https://www.youtube.com/@kvv98" target="_blank" class="link-card">
        📺 Latest Uploads
      </a>
      <a href="https://www.youtube.com/@kvv98/playlists" target="_blank" class="link-card">
        📂 Playlists
      </a>
    </div>
  </div>

</body>
</html>
